server:
  port: 8081
spring:
  application:
    name: schedule-notification
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/schedule_notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password_here}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:${RABBITMQ_DEFAULT_USER:myuser}}
    password: ${RABBITMQ_PASS:${RABBITMQ_DEFAULT_PASS:secret}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${EMAIL:}
    password: ${PASSWORD_EMAIL:${EMAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
notification:
  days-before: 2
  scheduler:
    job-interval-ms: 60000
broker:
  exchange:
    name: schedule.direct.exchange
  create-queue:
    name: schedule.create
  update-queue:
    name: schedule.update
  cancel-queue:
    name: schedule.cancel